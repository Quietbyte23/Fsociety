<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>fsociety terminal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="terminal">
  <div class="output" id="output">

    <h1 class="logo-text">fsociety</h1>
    <p class="sub">unauthorized access prohibited</p>
    <p>Type <span class="green">help</span> to begin.</p>

  </div>

  <div class="input-line">
    <span class="prompt">$</span>
    <input type="text" id="commandInput" autofocus />
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
